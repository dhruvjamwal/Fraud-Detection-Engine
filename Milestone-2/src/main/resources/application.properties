spring.application.name=fraud-engine

# MySQL Configuration (Real Database)
spring.datasource.url=jdbc:mysql://localhost:3306/fraud_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (Auto-creates tables with new columns like 'merchantCategory')
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect